[package]
name = "algorithco-shot"
version = "0.2.1"
description = "Offline screenshots, OCR search and privacy tools for Windows, macOS and Linux"
authors = ["Algorithco and contributors"]
license = "MIT"
repository = "https://github.com/algorithco/AlgorithShot"
readme = "../../README.md"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "algorithco_shot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "rayon"] }
oxipng = { version = "10.2.1", default-features = false, features = ["parallel"] }
fast_image_resize = "6.1.0"
webp = "0.3.1"
image_hasher = "3.1.1"
regex = "1.13.1"
chrono = "0.4.45"
parking_lot = "0.13.0"
log = "0.4.34"
anyhow = "1.0.104"
trash = "5.2.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.28.0", features = ["v4", "v7"] }
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
rxing = { version = "0.9.3", default-features = false, features = ["decoders", "multi_barcode_readers", "encoding_rs", "full_barcode_format_support"] }
tauri-plugin-drag = "2.1.1"
sys-locale = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_System_Com", "Win32_UI_Accessibility", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Shell", "Win32_System_WinRT", "Win32_System_Variant", "Win32_UI_Input_KeyboardAndMouse", "Win32_Globalization", "Win32_System_Registry", "Win32_System_LibraryLoader", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation", "Foundation_Collections", "Globalization", "Media_FaceAnalysis"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "~2.11.0"
tauri-plugin-process = "~2.3.1"

[target.'cfg(not(target_os = "windows"))'.dependencies]
clipboard-rs = { version = "0.3.5", features = ["wayland"] }
rustface = "0.1.7"
xcap = "0.9.8"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.14.0"

[target.'cfg(target_os = "macos")'.dependencies]
icns = "0.5.0"
plist = "1.10.3"
objc2-foundation = { version = "0.3.2", features = ["NSFileManager", "NSURL", "NSString"] }

[dev-dependencies]
qrcode = { version = "0.14.1", default-features = false, features = ["image"] }

# Image work in dependencies is slow unoptimized; keep debug builds usable.
[profile.dev.package."*"]
opt-level = 2
