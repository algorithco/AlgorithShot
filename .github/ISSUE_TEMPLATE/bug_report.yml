name: Bug report
description: Something in AlgorithShot doesn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Please remove private data from screenshots and logs.
        Email security problems instead, as described in [SECURITY.md](https://github.com/algorithco/algorith-shot/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: AlgorithShot version
      description: Shown in Settings › About.
      placeholder: "0.1.1"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Capture and overlay
        - Copy text (OCR), QR or colour picker
        - Quick card
        - Editor
        - Library and search
        - Settings or guided setup
        - Installer or updates
        - API (shot-api)
        - Something else
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press Print Screen
        2. Drag a region
        3. ...
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Other details
      description: Monitors and scaling (for example, two monitors at 150%), the app language, screenshots or logs.
