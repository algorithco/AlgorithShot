name: Bug report
description: Something in AlgorithShot doesn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Please remove private data from screenshots and logs.
        Email security problems instead, as described in [SECURITY.md](https://github.com/algorithco/AlgorithShot/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: AlgorithShot version
      description: Shown in Settings › About.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (X11)
        - Linux (Wayland, limited support)
        - API only
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system and version
      placeholder: "Windows 11 24H2, macOS 15, or Ubuntu 24.04 / GNOME X11"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Capture and overlay
        - Copy text (OCR), QR or colour picker
        - Quick card
        - Editor
        - Library and search
        - Settings or guided setup
        - Installer or updates
        - API (shot-api)
        - Something else
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press Ctrl+Alt+A
        2. Drag a region
        3. ...
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Other details
      description: Monitors and scaling (for example, two monitors at 150%), the app language, screenshots or logs.
