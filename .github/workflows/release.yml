name: Desktop release artifacts

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: release (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            args: ''
          - os: macos-15
            platform: darwin-universal
            args: '--target universal-apple-darwin'
          - os: ubuntu-24.04
            platform: linux-x86_64
            args: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      WEBKIT_DISABLE_COMPOSITING_MODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.29.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Dpkg::Lock::Timeout=120 -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf libatspi2.0-dev at-spi2-core pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev xvfb dbus-x11
      - run: pnpm install --frozen-lockfile
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --no-self-update
      - name: Install both macOS target architectures
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri -> target/release-build
      - name: Validate release metadata and offline OCR models
        run: |
          pnpm test:release
          pnpm test:ocr
      - name: Build Windows and macOS installers without release secrets
        if: runner.os != 'Linux'
        env:
          BUILD_ARGS: ${{ matrix.args }}
        shell: bash
        run: pnpm release:build:unsigned $BUILD_ARGS
      - name: Build Linux packages and verify native OCR
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- pnpm release:build:unsigned
      # This action uploads files for maintainer review. No job can publish a
      # release or access the updater signing key.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-${{ matrix.platform }}
          path: desktop/.local/release/*/${{ matrix.platform }}/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
